<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - QuantAI Terminal</title>
    <!-- Brand Favicon -->
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="shortcut icon" href="/static/favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0b0e14; color: #e2e8f0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        .glass-card { background: rgba(18, 24, 38, 0.9); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .neon-glow { box-shadow: 0 0 35px rgba(6, 182, 212, 0.25); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="glass-card rounded-3xl p-8 max-w-md w-full shadow-2xl neon-glow">
        
        <!-- Logo & Title -->
        <div class="text-center mb-8">
            <img src="/static/logo.svg" alt="QuantAI Logo" class="w-16 h-16 mx-auto mb-4 hover:scale-105 transition-all shadow-2xl">
            <h1 class="text-2xl font-black tracking-wide bg-gradient-to-r from-amber-400 via-cyan-400 to-emerald-400 bg-clip-text text-transparent">
                QUANTAI TERMINAL
            </h1>
            <p class="text-xs text-gray-400 mt-1">Autonomous Self-Learning Trading Portal</p>
        </div>

        {% if error %}
        <div class="mb-5 p-3 rounded-xl bg-rose-500/20 border border-rose-500/40 text-rose-300 text-xs flex items-center gap-2">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <!-- Login Form -->
        <form method="POST" action="/login" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">Username</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-gray-500">
                        <i class="fa-solid fa-user text-sm"></i>
                    </span>
                    <input type="text" name="username" required placeholder="Enter username" class="w-full pl-10 pr-4 py-3 rounded-xl bg-gray-900/80 border border-gray-700 text-sm text-gray-100 placeholder-gray-500 focus:outline-none focus:border-cyan-500 transition-all">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-gray-500">
                        <i class="fa-solid fa-key text-sm"></i>
                    </span>
                    <input type="password" name="password" required placeholder="Enter password" class="w-full pl-10 pr-4 py-3 rounded-xl bg-gray-900/80 border border-gray-700 text-sm text-gray-100 placeholder-gray-500 focus:outline-none focus:border-cyan-500 transition-all">
                </div>
            </div>

            <button type="submit" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-amber-500 to-cyan-500 hover:from-amber-600 hover:to-cyan-600 text-white font-bold text-sm tracking-wider uppercase shadow-lg transition-all flex items-center justify-center gap-2 mt-2">
                <i class="fa-solid fa-right-to-bracket"></i> Secure Login
            </button>
        </form>

        <div class="mt-6 pt-4 border-t border-gray-800 text-center">
            <p class="text-[11px] text-gray-500">Authorized Personnel Only &bull; $100 Quant Shield Active</p>
        </div>

    </div>
</body>
</html>
